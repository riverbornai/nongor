[project]
name = "rag-poc"
version = "0.1.0"
description = "Nongor: local-first RAG chat backend (FastAPI, LanceDB, BGE-M3)"
license = { text = "PolyForm Internal Use License 1.0.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.54.0",
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    "FlagEmbedding>=1.3.3",
    "trafilatura>=2.0.0",
    "playwright>=1.48.0",
    "tiktoken>=0.8.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "numpy>=1.26.0",
    "docling>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
