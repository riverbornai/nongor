version: '3.8'

services:
  backend:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NUXT_PUBLIC_API_URL=http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
